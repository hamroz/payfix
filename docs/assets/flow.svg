<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-label="Acme pays 600 and 500 dollars. PayFix settles 1,000 to invoice A, 60 to invoice B, and refunds 40.">
  <style>
    :root { --ink:#1E1B4B; --mute:#6B7280; --card:#FFFFFF; --line:#E0E7FF; --glow:#EEF2FF; }
    @media (prefers-color-scheme: dark) { :root { --ink:#EEF2FF; --mute:#9CA3AF; --card:#14142B; --line:#2E2E5E; --glow:#1B1B3A; } }
    text { font-family: -apple-system, "Inter", "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .mute { fill: var(--mute); font-size: 12px; }
    .amt  { font-size: 18px; font-weight: 700; }
    .lbl  { font-size: 13px; font-weight: 600; }
    .node { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .rail { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 4 6; }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  </defs>

  <!-- rails -->
  <path class="rail" d="M170,100 C250,100 270,160 340,160"/>
  <path class="rail" d="M170,220 C250,220 270,160 340,160"/>
  <path class="rail" d="M540,160 C610,160 630,70 700,70"/>
  <path class="rail" d="M540,160 L700,160"/>
  <path class="rail" d="M540,160 C610,160 630,250 700,250"/>

  <!-- payments -->
  <rect class="node" x="40" y="72" width="130" height="56" rx="14"/>
  <text class="amt" x="105" y="98" text-anchor="middle">$600</text><text class="mute" x="105" y="116" text-anchor="middle">Acme pays</text>
  <rect class="node" x="40" y="192" width="130" height="56" rx="14"/>
  <text class="amt" x="105" y="218" text-anchor="middle">$500</text><text class="mute" x="105" y="236" text-anchor="middle">Acme pays</text>

  <!-- PayFix -->
  <rect x="340" y="120" width="200" height="80" rx="20" fill="url(#g)"/>
  <text x="440" y="152" text-anchor="middle" style="fill:#fff;font-size:12px;font-weight:600;letter-spacing:.08em">PAYFIX RECEIVED</text>
  <text x="440" y="180" text-anchor="middle" style="fill:#fff;font-size:24px;font-weight:700">$1,100</text>

  <!-- outcomes -->
  <rect class="node" x="700" y="42" width="150" height="56" rx="14" style="stroke:#6366F1"/>
  <text class="amt" x="775" y="68" text-anchor="middle">$1,000</text><text class="mute" x="775" y="86" text-anchor="middle">Invoice A · settled</text>
  <rect class="node" x="700" y="132" width="150" height="56" rx="14" style="stroke:#A78BFA"/>
  <text class="amt" x="775" y="158" text-anchor="middle">$60</text><text class="mute" x="775" y="176" text-anchor="middle">Invoice B · $340 left</text>
  <rect class="node" x="700" y="222" width="150" height="56" rx="14" style="stroke:#5EF2C2"/>
  <text class="amt" x="775" y="248" text-anchor="middle">$40</text><text class="mute" x="775" y="266" text-anchor="middle">Refund · confirmed</text>

  <text class="mute" x="440" y="300" text-anchor="middle">$1,000 + $60 + $40 = $1,100 · unresolved excess $0</text>

  <!-- in: coins travel to PayFix -->
  <g>
    <circle r="7" fill="#6366F1"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.35;1" calcMode="linear" path="M170,100 C250,100 270,160 340,160"/><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.33;0.36;1"/></circle>
    <circle r="7" fill="#6366F1"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.35;1" calcMode="linear" path="M170,220 C250,220 270,160 340,160" begin="0.5s"/><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.33;0.36;1" begin="0.5s"/></circle>
  </g>
  <!-- out: coins fan out -->
  <circle r="7" fill="#6366F1"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.45;0.8;1" calcMode="linear" path="M540,160 C610,160 630,70 700,70"/><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.45;0.47;0.8;0.83"/></circle>
  <circle r="5" fill="#A78BFA"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.45;0.8;1" calcMode="linear" path="M540,160 L700,160"/><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.45;0.47;0.8;0.83"/></circle>
  <circle r="4" fill="#5EF2C2"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.45;0.8;1" calcMode="linear" path="M540,160 C610,160 630,250 700,250"/><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.45;0.47;0.8;0.83"/></circle>
</svg>
